# https://github.com/bero-sim/pdetarc-tools/blob/main/.github/workflows/build-release.yml
name: Build and Release Tools with App Bundle

on:
  push:
    tags:
      - 'v*'

# env:
#   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            pyinstaller --onefile --icon=PDETARC_EXTRACT.ico pdetarc-extract.py
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            pyinstaller --onefile --icon=PDETARC_EXTRACT.icns pdetarc-extract.py
          else
            pyinstaller --onefile pdetarc-extract.py
          fi

      - name: Post Build (Rename and Zip)
        shell: bash
        run: |
          mkdir -p dist_zip
          cp ./LICENSE_THIRD_PARTY.txt ./dist/
          # 名前を「extract」であることがわかるように明確化
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/pdetarc-extract.exe dist/pdetarc-extract-windows.exe
            python -c "import shutil; shutil.make_archive('dist_zip/pdetarc-extract-windows-latest', 'zip', 'dist')"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            mv dist/pdetarc-extract dist/pdetarc-extract-mac
            python -c "import shutil; shutil.make_archive('dist_zip/pdetarc-extract-macos-latest', 'zip', 'dist')"
          else
            mv dist/pdetarc-extract dist/pdetarc-extract-linux
            python -c "import shutil; shutil.make_archive('dist_zip/pdetarc-extract-ubuntu-latest', 'zip', 'dist')"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist_zip/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts (self binaries)
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Fetch external assets from pdetarc-docker-app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p all-assets
          # 失敗しても止まらないように || true をつけるか、確実に存在するタグを指定
          gh release download v1.0.0 --repo bero-sim/pdetarc-docker-app --pattern "*" --dir all-assets || echo "No external assets found"

          # ツールソースのパッキング
          tar --sort=name --mtime='2026-01-01Z' --owner=0 --group=0 --numeric-owner \
              --exclude='.git' \
              --exclude='all-assets' \
              -cvzf all-assets/pdetarc-tools-source.tar.gz .

      - name: Generate unified bundle.toml
        run: |
          VERSION=${GITHUB_REF_NAME}
          APP_REPO="bero-sim/pdetarc-docker-app"
          APP_VERSION="v1.0.0"
          
          # bundle.toml を新規作成
          echo "# Unified Bundle for PDETARC" > bundle.toml

          cd all-assets
          # *.tar (Dockerイメージ) もスキャン対象に含める
          for f in *; do
            # 隠しファイルやディレクトリを除外
            [ -f "$f" ] || continue
            
            NAME="$f"
            SHA=$(sha256sum "$f" | awk '{print $1}')

            # 外部アセットか自前アセットかでURLを分岐
            if [[ "$NAME" == *"pdetarc-docker-app"* ]] || [[ "$NAME" == *"pdetarc_image"* ]] || [[ "$NAME" == "pdetarc-windows.zip" ]]; then
              URL="https://github.com/${APP_REPO}/releases/download/${APP_VERSION}/${NAME}"
            else
              URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${NAME}"
            fi

            echo "[[bundle]]" >> ../bundle.toml
            echo "name = \"$NAME\"" >> ../bundle.toml
            echo "file = \"$NAME\"" >> ../bundle.toml
            echo "url = \"$URL\"" >> ../bundle.toml
            echo "sha256 = \"$SHA\"" >> ../bundle.toml
            echo "source = \"github-releases\"" >> ../bundle.toml
            echo "" >> ../bundle.toml
          done
          cd ..

      - name: Create Release and Upload All Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-assets/*
            bundle.toml
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
